name: Spawndroid Android tests
description: >-
  Run Android tests on hosted devices using spawndroid.yaml, with automatic setup, JUnit reports, and cleanup on failure.
author: Spawndroid

branding:
  icon: smartphone
  color: green

inputs:
  api-key:
    description: Spawndroid API key with the `upload` scope. Store it as a secret.
    required: true
  config:
    description: Path to the spawndroid.yaml spec.
    required: false
    default: spawndroid.yaml
  api-url:
    description: Console origin.
    required: false
    default: https://app.spawndroid.io
  version:
    description: CLI version to run.
    required: false
    default: "0.1.9"

outputs:
  session-id:
    description: The Spawndroid session id for this run.
    value: ${{ steps.run.outputs.session-id }}
  run-url:
    description: Link to the run in the console.
    value: ${{ steps.run.outputs.run-url }}
  result:
    description: '"passed" or "failed".'
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - id: run
      shell: bash
      run: npx --yes spawndroid@${{ inputs.version }} run --config "${{ inputs.config }}"
      env:
        SPAWNDROID_API_KEY: ${{ inputs.api-key }}
        SPAWNDROID_URL: ${{ inputs.api-url }}
